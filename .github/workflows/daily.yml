name: daily project

# 매일 하나씩 미니 프로젝트를 만들어 새 repo 로 올린다.
# GitHub 러너에서 돌기 때문에 맥이 꺼져 있어도 상관없다.
#
# Secrets:
#   GH_PAT             repo 생성 권한이 있는 토큰 (Administration + Contents + Workflows) — 필수
#   DISCORD_WEBHOOK    알림 — 선택
#   ANTHROPIC_API_KEY  선택. 넣으면 모델이 그날의 카드(소재 × 형태 × 제약)를 해석해
#                      매번 새로운 프로젝트를 설계한다. 없으면 오프라인 생성기가
#                      네 갈래(세포 자동자 / 랭턴의 개미 / 미로 / 울람 나선) 중
#                      날짜에 따라 하나를 골라 만든다. 어느 쪽이든 잔디는 끊기지 않는다.

on:
  schedule:
    - cron: '10 0 * * *'    # KST 09:10 — 본 실행
    - cron: '10 13 * * *'   # KST 22:10 — 아침에 실패했으면 여기서 건진다
  workflow_dispatch:
    inputs:
      dry_run:
        description: '푸시 없이 생성만'
        type: boolean
        default: false
      force:
        description: '오늘 이미 만들었어도 강행'
        type: boolean
        default: false

concurrency:
  group: daily-project
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 오늘 이미 만들었는지 확인
        id: guard
        run: |
          TODAY=$(TZ=Asia/Seoul date +%F)
          echo "today=$TODAY" >> "$GITHUB_OUTPUT"
          if [ "${{ inputs.force }}" = "true" ]; then
            echo "done=false" >> "$GITHUB_OUTPUT"
          elif node -e "const h=require('./data/history.json');process.exit(h.some(x=>x.date===process.argv[1])?0:1)" "$TODAY"; then
            echo "done=true" >> "$GITHUB_OUTPUT"
            echo ":white_check_mark: $TODAY 는 이미 만들었다. 건너뛴다." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "done=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 생성 · 검증 · 푸시
        if: steps.guard.outputs.done == 'false'
        id: run
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_OWNER: ${{ github.repository_owner }}
          GIT_NAME: ${{ github.repository_owner }}
          GIT_EMAIL: ${{ github.repository_owner }}@users.noreply.github.com
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          TZ_OFFSET_HOURS: '9'
        run: |
          set -o pipefail
          node generator/publish.mjs 2>&1 | tee run.log

      - name: 실행 로그를 요약에 붙이기
        if: steps.guard.outputs.done == 'false' && always()
        run: |
          {
            echo '```'
            tail -40 run.log 2>/dev/null || echo '로그 없음'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 인덱스 커밋
        if: steps.guard.outputs.done == 'false' && steps.run.outcome == 'success' && inputs.dry_run != true
        run: |
          git config user.name  "${{ github.repository_owner }}"
          git config user.email "${{ github.repository_owner }}@users.noreply.github.com"
          git add data/history.json README.md
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "log: ${{ steps.guard.outputs.today }} 프로젝트 기록"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push
          fi

      - name: 실패하면 Discord 로 알린다
        if: failure() && steps.guard.outputs.done == 'false'
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          [ -n "$WEBHOOK" ] || exit 0
          export RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          node -e '
            const body = {
              embeds: [{
                title: "daily-lab 오늘 실행 실패",
                url: process.env.RUN_URL,
                description: "```\n" + require("fs").readFileSync("run.log","utf8").trim().split("\n").slice(-12).join("\n").slice(-1200) + "\n```",
                color: 0xd04040,
              }],
            };
            fetch(process.env.WEBHOOK, {
              method: "POST",
              headers: { "content-type": "application/json" },
              body: JSON.stringify(body),
            }).then(r => console.log("discord", r.status));
          '
        continue-on-error: true
